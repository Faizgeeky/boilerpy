version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: {{project_name}}_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: {{project_name}}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: {{project_name}}_app
    command: gunicorn -w 4 -b 0.0.0.0:5000 "app:create_app()"
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://admin:admin@mongodb:27017/{{project_name}}?authSource=admin
      - DEBUG=False
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  mongodb_data:
